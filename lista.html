<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Listagens - Kartódromo Internacional de Mauá</title>
     
    <link rel="icon" href="LOGO1.png">
    <link rel="stylesheet" href="style.css">
    <script src="kim.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 30px 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { margin-bottom: 25px; text-align: center; }
    header h1 { font-size: 28px; color: #0f172a; margin-bottom: 5px; }
    header p { color: #64748b; font-size: 14px; }

    /* Navegação por Abas */
    .tabs { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 25px; }
    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #2563eb; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }

    /* Conteúdo das Abas */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards e Grids */
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .card h3 { font-size: 18px; margin-bottom: 10px; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
    .card-info { margin-bottom: 12px; font-size: 14px; color: #475569; }
    .card-info strong { color: #0f172a; }

    /* Galeria de Fotos dentro do Card de Campeonatos */
    .track-gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .track-gallery img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #cbd5e1; }

    /* Tabelas */
    .table-container { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 16px; text-align: left; font-size: 14px; }
    th { background-color: #f8fafc; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; }
    tr:not(:last-child) td { border-bottom: 1px solid #f1f5f9; }
    tr:hover td { background-color: #f8fafc; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Sistema de Gerenciamento do Kartódromo</h1>
      <p>Visualização unificada dos registros cadastrados no sistema</p>
    </header>

    <!-- Botões das Abas -->
    <div class="tabs">
      <button class="tab-btn active" onclick="trocarAba('campeonatos', this)">🏆 Campeonatos</button>
      <button class="tab-btn" onclick="trocarAba('pilotos', this)">🏎️ Pilotos</button>
      <button class="tab-btn" onclick="trocarAba('funcionarios', this)">👔 Funcionários</button>
    </div>

    <!-- Aba 1: Campeonatos -->
    <div id="campeonatos" class="tab-content active">
      <div id="gridCampeonatos" class="grid-cards">
        <!-- Preenchido via JS -->
      </div>
    </div>

    <!-- Aba 2: Pilotos -->
    <div id="pilotos" class="tab-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Equipe</th>
              <th>Idade</th>
              <th>Nº</th>
            </tr>
          </thead>
          <tbody id="tabelaPilotos">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Aba 3: Funcionários -->
    <div id="funcionarios" class="tab-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Cargo</th>
              <th>E-mail</th>
              <th>Salário</th>
            </tr>
          </thead>
          <tbody id="tabelaFuncionarios">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.addEventListener('DOMContentLoaded', () => {
      carregarCampeonatos();
      carregarPilotos();
      carregarFuncionarios();
    });

    // Função para alternar visibilidade das abas
    function trocarAba(idAba, elemento) {
      document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(idAba).classList.add('active');
      elemento.classList.add('active');
    }

    // Listar Campeonatos
    async function carregarCampeonatos() {
      try {
        const res = await fetch(`${API_BASE}/campeonatos`);
        const dados = await res.json();
        const container = document.getElementById('gridCampeonatos');
        container.innerHTML = '';

        if (dados.length === 0) {
          container.innerHTML = '<p>Nenhum campeonato encontrado.</p>';
          return;
        }

        dados.forEach(c => {
          const fotos = [c.fotoPista1, c.fotoPista2, c.fotoPista3, c.fotoPista4]
            .filter(Boolean)
            .map(url => url.startsWith('/') ? `http://localhost:3000${url}` : url);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${c.nome}</h3>
            <div class="card-info"><strong>Voltas:</strong> ${c.voltas}</div>
            <div class="card-info"><strong>Pistas Cadastradas:</strong> ${fotos.length}</div>
            <div class="track-gallery">
              ${fotos.map(src => `<img src="${src}" onerror="this.src='https://via.placeholder.com/60?text=Pista'" />`).join('')}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Erro ao carregar campeonatos:', err);
      }
    }

    // Listar Pilotos
    async function carregarPilotos() {
      try {
        const res = await fetch(`${API_BASE}/pilotos`);
        const dados = await res.json();
        const tbody = document.getElementById('tabelaPilotos');
        tbody.innerHTML = '';

        dados.forEach(p => {
          const fotoUrl = p.foto ? p.foto : 'https://via.placeholder.com/40?text=Piloto';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${fotoUrl}" class="avatar" onerror="this.src='https://via.placeholder.com/40?text=P'"></td>
            <td><strong>${p.nome}</strong></td>
            <td>${p.cpf}</td>
            <td><span class="badge">${p.equipe || 'N/A'}</span></td>
            <td>${p.idade || '-'} anos</td>
            <td>#${p.numero || '0'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Erro ao carregar pilotos:', err);
      }
    }

    // Listar Funcionários
    async function carregarFuncionarios() {
      try {
        const res = await fetch(`${API_BASE}/funcionarios`);
        const dados = await res.json();
        const tbody = document.getElementById('tabelaFuncionarios');
        tbody.innerHTML = '';

        dados.forEach(f => {
          const fotoUrl = f.foto ? f.foto : 'https://via.placeholder.com/40?text=Func';
          const salarioFormatado = f.salario ? Number(f.salario).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : 'R$ 0,00';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${fotoUrl}" class="avatar" onerror="this.src='https://via.placeholder.com/40?text=F'"></td>
            <td><strong>${f.nome}</strong></td>
            <td>${f.cpf}</td>
            <td>${f.cargo}</td>
            <td>${f.email || '-'}</td>
            <td>${salarioFormatado}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Erro ao carregar funcionários:', err);
      }
    }
  </script>
</body>
</html>
