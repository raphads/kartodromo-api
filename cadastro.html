<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit">
    <title>Kartódromo Internacional de Mauá</title>
    <link rel="icon" href="LOGO1.png">
    <link rel="stylesheet" href="style.css">
    <script src="kim.js"></script>
    <script type="text/javascript" src="jquery-3.5.1.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>


<div class="container-fluid">
    <div class="row">
      <div class="col-md-3">
        
        <br><br><br><br><br><br>
       <form id="loginForm">
  <label>Usuário</label><br>
  <input type="text" id="usuario" placeholder="Digite seu Usuário" required><br><br>

  <label>Email</label><br>
  <input type="email" id="email" placeholder="Digite seu Email" required><br><br>

  <label>Senha</label><br>
  <input type="password" id="senha" placeholder="***" required><br><br>

  <label>Confirmar Senha</label><br>
  <input type="password" id="confirmarSenha" placeholder="***" required><br><br>

  <button type="submit">Cadastrar</button>
</form>
        </div>

    <div class="col-md-9">

        <img src="LOGO1.png" width="100%" height="100%">

    </div>

  
    </div>
</div>


<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const usuario = document.getElementById('usuario').value;
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const confirmarSenha = document.getElementById('confirmarSenha').value;

    // Validação básica de confirmação de senha
    if (senha !== confirmarSenha) {
      alert('As senhas não coincidem!');
      return;
    }

    try {
      const response = await fetch('http://localhost:3000/api/usuarios', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ usuario, email, senha })
      });

      const data = await response.json();

      if (response.ok) {
        alert('Usuário cadastrado com sucesso!');
        document.getElementById('loginForm').reset();
      } else {
        alert('Erro: ' + data.error);
      }
    } catch (error) {
      console.error('Erro na requisição:', error);
      alert('Falha ao conectar com a API.');
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
