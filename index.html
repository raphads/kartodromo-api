<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit">
    <title>Kartódromo Internacional de Mauá</title>
    <link rel="icon" href="LOGO1.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <br><br><br><br><br><br>
            <form id="loginForm">
                <label>Usuário</label><br>
                <input type="text" id="usuario" placeholder="Digite seu Usuário" required><br><br>
                
                <label>Senha</label><br>
                <input type="password" id="senha" placeholder="***" required><br><br>
                
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form><br>
            
            <label>Não tem uma Conta?</label><br>
            <a href="cadastro.html" style="color: #EA412C;">Cadastre-se</a>
        </div>

        <div class="col-md-9">
            <img src="LOGO1.png" width="100%" height="100%">
        </div>
    </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;

    try {
      const response = await fetch('http://localhost:3000/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ usuario, senha })
      });

      const data = await response.json();

      if (response.ok) {
        // Salva as informações da sessão no navegador
        localStorage.setItem('usuarioLogado', JSON.stringify(data.usuario));
        alert('Login realizado com sucesso!');
        
        // Redireciona para a página principal
        window.location.href = 'index.html';
      } else {
        alert('Erro: ' + data.error);
      }
    } catch (error) {
      console.error('Erro ao conectar na API:', error);
      alert('Falha ao conectar com o servidor.');
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
